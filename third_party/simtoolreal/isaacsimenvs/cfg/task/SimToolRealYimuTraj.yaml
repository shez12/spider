# SimToolReal "continuous trajectory" EVAL task — KUKA iiwa14 + Yimu-left (28 DoF).
#
# Same robot / reward / termination math as SimToolRealYimu.yaml, but the goal
# stream is NOT the training-time random walk.  Instead the env replays one
# continuous multi-subtarget trajectory loaded from
# `reset.fixed_trajectory_file` (see
# isaacsimenvs/tasks/simtoolreal/utils/trajectory_sampling.py): K subtargets
# sampled along a single smooth curve inside `reset.target_volume_*`, with
# segments that are deliberately dense (small arc-length spacing) and segments
# that are sparse (large spacing).
#
# The file is empty here on purpose — isaacsimenvs/eval_trajectory.py generates
# it at run time (and writes it next to the rollout artifacts).  You can also
# point at a pre-generated file and drive the env from the training entry point:
#
#   python isaacsimenvs/train.py --task Isaacsimenvs-SimToolRealYimuTraj-Direct-v0 \
#       --agent rl_games_sapg_cfg_entry_point --test --headless --capture_viewer \
#       --checkpoint <ckpt> env.scene.num_envs=1 \
#       env.reset.fixed_trajectory_file=<traj.json> \
#       env.termination.max_consecutive_successes=<K>
#
# -----------------------------------------------------------------------------
# DirectRLEnvCfg top-level required fields
# -----------------------------------------------------------------------------
decimation: 2
episode_length_s: 10.0
action_space: 28
# observation_space / state_space are computed in SimToolRealEnv.__init__.

# -----------------------------------------------------------------------------
# 1) sim
# -----------------------------------------------------------------------------
sim:
  dt: 0.00833333333   # 1/120
  render_interval: 2
  gravity: [0.0, 0.0, -9.81]
  physx:
    solver_type: 1
    min_position_iteration_count: 8
    max_position_iteration_count: 8
    min_velocity_iteration_count: 0
    max_velocity_iteration_count: 0
    bounce_threshold_velocity: 0.2
    friction_offset_threshold: 0.04
    friction_correlation_distance: 0.025

# -----------------------------------------------------------------------------
# 2) scene — single env by default (eval / visualization)
# -----------------------------------------------------------------------------
scene:
  num_envs: 1
  env_spacing: 1.2
  replicate_physics: false
  clone_in_fabric: false

# Only used by --capture_video (eval_trajectory.py points the viewport camera
# here, offset by env 0's origin).  A 45-ish degree view of the table so both
# the hand and the whole target volume (z 0.6 .. 0.95) stay in frame.
viewer:
  eye: [0.85, -0.95, 1.05]
  lookat: [0.10, 0.0, 0.75]
  resolution: [1280, 720]

# -----------------------------------------------------------------------------
# 3) assets
# -----------------------------------------------------------------------------
assets:
  robot_urdf: "assets/urdf/kuka_yimu_left_description/iiwa14_yimu_left.urdf"
  table_urdf: "assets/urdf/table_narrow.urdf"

  object_name: "handle_head_primitives"
  handle_head_types: ["hammer", "screwdriver", "marker", "spatula", "eraser", "brush"]
  # Small pool: one env only needs one object, and a big pool just adds
  # URDF->USD conversion time at startup.
  num_assets_per_type: 10

  modify_asset_frictions: true
  robot_friction: 0.5
  finger_tip_friction: 1.5
  object_friction: 0.5
  table_friction: 0.5

# -----------------------------------------------------------------------------
# 4) obs — identical to training (asymmetric actor-critic)
# -----------------------------------------------------------------------------
obs:
  state_list: [joint_pos, joint_vel, prev_action_targets, palm_pos, palm_rot, palm_vel,
               object_rot, object_vel, fingertip_pos_rel_palm, keypoints_rel_palm,
               keypoints_rel_goal, object_scales, closest_keypoint_max_dist,
               closest_fingertip_dist, lifted_object, progress, successes, reward]
  obs_list: [joint_pos, joint_vel, prev_action_targets, palm_pos, palm_rot,
             object_rot, fingertip_pos_rel_palm, keypoints_rel_palm,
             keypoints_rel_goal, object_scales]
  clamp_abs_observations: 10.0

# -----------------------------------------------------------------------------
# 5) action
# -----------------------------------------------------------------------------
action:
  arm_moving_average: 0.1
  hand_moving_average: 0.1
  dof_speed_scale: 1.5

# -----------------------------------------------------------------------------
# 6) reward — unchanged from training (eval only reads the success signal)
# -----------------------------------------------------------------------------
reward:
  keypoint_rew_scale: 200.0
  keypoint_scale: 1.5
  object_base_size: 0.04
  fixed_size: [0.141, 0.03025, 0.0271]
  fixed_size_keypoint_reward: true

  lifting_rew_scale: 20.0
  lifting_bonus: 300.0
  lifting_bonus_threshold: 0.15

  distance_delta_rew_scale: 50.0
  reach_goal_bonus: 1000.0

  kuka_actions_penalty_scale: 0.03
  hand_actions_penalty_scale: 0.003

# -----------------------------------------------------------------------------
# 7) reset — deterministic start pose + the fixed trajectory file
# -----------------------------------------------------------------------------
reset:
  # No initial noise: the same checkpoint should see the same start state.
  reset_position_noise_x: 0.0
  reset_position_noise_y: 0.0
  reset_position_noise_z: 0.0
  fixed_start_pose: null

  reset_dof_pos_random_interval_arm: 0.0
  reset_dof_pos_random_interval_fingers: 0.0
  reset_dof_vel_random_interval: 0.0

  table_reset_z: 0.38
  table_reset_z_range: 0.0
  table_object_z_offset: 0.25

  # MUST stay "delta" when `fixed_trajectory_file` is set: reset_utils keys the
  # "advance to the next subtarget" branch off mode != "absolute", so
  # "absolute" would restart the trajectory at subtarget 0 on every goal hit.
  goal_sampling_type: delta
  delta_goal_distance: 0.1
  delta_rotation_degrees: 90.0
  # Trajectory generation volume (env-local).  Keep in sync with the training
  # target volume so the eval goals stay in-distribution.
  target_volume_mins: [-0.35, -0.2, 0.6]
  target_volume_maxs: [0.35, 0.2, 0.95]
  target_volume_region_scale: 1.0

  # Filled in by eval_trajectory.py (JSON with pos (N,K,3) + quat_wxyz (N,K,4)).
  fixed_trajectory_file: ''
  fixed_trajectory_count: 0

# -----------------------------------------------------------------------------
# 8) termination
# -----------------------------------------------------------------------------
termination:
  episode_length: 600                 # per-goal budget (reset on each goal hit)
  success_tolerance: 0.075
  target_success_tolerance: 0.01
  # Eval pins the criterion instead of running the training curriculum.  This
  # CANNOT be set from YAML: configclass type-checks overrides against the
  # field's None default (see the note on ResetCfg.fixed_goal_pose), so
  # eval_trajectory.py sets it in Python (default 0.03, override with
  # --success_tolerance).  Threshold on the keypoint distance is
  # eval_success_tolerance x reward.keypoint_scale (1.5).
  success_steps: 10
  # Overwritten with the trajectory length K so an episode ends exactly when
  # the trajectory is exhausted.
  max_consecutive_successes: 50
  force_consecutive_near_goal_steps: false
  tolerance_curriculum_increment: 0.9
  tolerance_curriculum_interval: 3000

# -----------------------------------------------------------------------------
# 9) domain_randomization — OFF for eval (we want the policy's true tracking
#    performance, not its robustness to delays / noise / impulses)
# -----------------------------------------------------------------------------
domain_randomization:
  use_obs_delay: false
  obs_delay_max: 3
  use_action_delay: false
  action_delay_max: 3

  use_object_state_delay_noise: false
  object_state_delay_max: 10
  object_state_xyz_noise_std: 0.0
  object_state_rotation_noise_degrees: 0.0
  object_scale_noise_multiplier_range: [1.0, 1.0]

  joint_velocity_obs_noise_std: 0.0

  force_scale: 0.0
  force_prob_range: [0.0001, 0.0001]
  force_decay: 0.0
  force_decay_interval: 0.08
  force_only_when_lifted: true

  torque_scale: 0.0
  torque_prob_range: [0.0001, 0.0001]
  torque_decay: 0.0
  torque_decay_interval: 0.08
  torque_only_when_lifted: true
